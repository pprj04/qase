<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContactVault Fixed</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #333; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    button { background: #4CAF50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #45a049; }
    .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
    .modal-bg.show { display: flex; justify-content: center; align-items: center; }
    .modal { background: white; padding: 24px; border-radius: 8px; min-width: 400px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 600; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn-cancel { background: #f44336; }
    .contact-list { margin-top: 20px; }
    .contact-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .contact-item:hover { background: #f9f9f9; }
    .contact-info { flex: 1; }
    .contact-name { font-weight: 600; }
    .contact-email { color: #666; font-size: 14px; }
    .contact-phone { color: #888; font-size: 13px; }
    .btn-delete { background: #f44336; padding: 4px 8px; font-size: 14px; }
    .empty-state { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ContactVault</h1>
    <button id="addBtn" onclick="openModal()">Add Contact</button>
  </div>

  <div id="contactList" class="contact-list"></div>

  <div id="modalBg" class="modal-bg" onclick="closeModalOnBg(event)">
    <div class="modal">
      <h2 id="modalTitle">Add New Contact</h2>
      <div class="form-group">
        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" placeholder="Enter name">
      </div>
      <div class="form-group">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label for="phoneInput">Phone</label>
        <input type="tel" id="phoneInput" placeholder="Enter phone">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button id="saveBtn" onclick="saveContact()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // FIXED VERSION: Uses localStorage for persistence
    let contacts = [];
    let editingIndex = -1;

    function loadContacts() {
      try {
        const stored = localStorage.getItem('contacts');
        contacts = stored ? JSON.parse(stored) : [
          { name: 'Alice Johnson', email: 'alice@example.com', phone: '555-0101' },
          { name: 'Bob Smith', email: 'bob@example.com', phone: '555-0102' },
          { name: 'Carol Davis', email: 'carol@example.com', phone: '555-0103' }
        ];
        // Seed localStorage if not present
        if (!stored) { localStorage.setItem('contacts', JSON.stringify(contacts)); }
      } catch {
        contacts = [];
      }
    }

    function saveToStorage() {
      localStorage.setItem('contacts', JSON.stringify(contacts));
    }

    function renderContacts() {
      const list = document.getElementById('contactList');
      if (contacts.length === 0) {
        list.innerHTML = '<div class="empty-state">No contacts yet. Click "Add Contact" to create one.</div>';
        return;
      }
      list.innerHTML = contacts.map((c, i) => `
        <div class="contact-item">
          <div class="contact-info">
            <div class="contact-name">${c.name}</div>
            <div class="contact-email">${c.email}</div>
            ${c.phone ? `<div class="contact-phone">${c.phone}</div>` : ''}
          </div>
          <button class="btn-delete" onclick="deleteContact(${i})">Delete</button>
        </div>
      `).join('');
    }

    function openModal(index) {
      editingIndex = index ?? -1;
      document.getElementById('modalBg').classList.add('show');
      if (editingIndex >= 0) {
        document.getElementById('modalTitle').textContent = 'Edit Contact';
        const c = contacts[editingIndex];
        document.getElementById('nameInput').value = c.name || '';
        document.getElementById('emailInput').value = c.email || '';
        document.getElementById('phoneInput').value = c.phone || '';
      } else {
        document.getElementById('modalTitle').textContent = 'Add New Contact';
        document.getElementById('nameInput').value = '';
        document.getElementById('emailInput').value = '';
        document.getElementById('phoneInput').value = '';
      }
    }

    function closeModal() {
      document.getElementById('modalBg').classList.remove('show');
      editingIndex = -1;
    }

    function closeModalOnBg(event) {
      if (event.target.id === 'modalBg') closeModal();
    }

    function saveContact() {
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();
      if (!name) { alert('Name is required'); return; }
      const contact = { name, email, phone };
      if (editingIndex >= 0) {
        contacts[editingIndex] = contact;
      } else {
        contacts.push(contact);
      }
      saveToStorage();
      renderContacts();
      closeModal();
    }

    function deleteContact(index) {
      contacts.splice(index, 1);
      saveToStorage();
      renderContacts();
    }

    // Initialize
    loadContacts();
    renderContacts();
  </script>
</body>
</html>

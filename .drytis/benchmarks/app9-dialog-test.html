<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DialogTest — Bug Registry</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #333; }
h1 { color: #2563eb; }
.bug-list { list-style: none; padding: 0; }
.bug-list li { padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.severity { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
.critical { background: #fee; color: #c00; }
.high { background: #ffd; color: #960; }
.medium { background: #eef; color: #048; }
form { background: #f9fafb; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
input, textarea, select { width: 100%; padding: 8px; margin: 4px 0 12px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
button:hover { background: #1d4ed8; }
.delete-btn { background: #dc2626; padding: 4px 12px; font-size: 12px; }
.error-msg { color: #dc2626; font-size: 14px; margin: 8px 0; display: none; }
</style>
</head>
<body>
<h1>Bug Registry</h1>

<form id="bugForm" onsubmit="return false;">
  <h3>Add New Bug</h3>
  <input type="text" id="title" placeholder="Bug title" required>
  <select id="severity">
    <option value="critical">Critical</option>
    <option value="high">High</option>
    <option value="medium">Medium</option>
  </select>
  <textarea id="description" placeholder="Description" rows="3"></textarea>
  <button type="button" id="submitBtn">Add Bug</button>
  <div class="error-msg" id="errorMsg"></div>
</form>

<ul class="bug-list" id="bugList">
  <li>No bugs yet. Add one above!</li>
</ul>

<hr>
<h3>Actions</h3>
<button id="alertBtn">About This App</button>
<button id="confirmBtn" style="background: #059669;">Export Bugs</button>
<button id="promptBtn" style="background: #7c3aed;">Search Bug by Title</button>

<script>
var bugs = [];
var nextId = 1;

document.getElementById('submitBtn').onclick = function() {
  var title = document.getElementById('title').value.trim();
  var severity = document.getElementById('severity').value;
  var desc = document.getElementById('description').value.trim();

  if (!title) {
    document.getElementById('errorMsg').textContent = 'Title is required';
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }
  document.getElementById('errorMsg').style.display = 'none';

  bugs.push({ id: nextId++, title: title, severity: severity, description: desc });
  renderBugs();
  document.getElementById('title').value = '';
  document.getElementById('description').value = '';
};

function renderBugs() {
  var list = document.getElementById('bugList');
  if (bugs.length === 0) {
    list.innerHTML = '<li>No bugs yet. Add one above!</li>';
    return;
  }
  list.innerHTML = bugs.map(function(b) {
    return '<li><span><strong>' + b.title + '</strong></span><span class="severity ' + b.severity + '">' + b.severity + '</span><button class="delete-btn" onclick="deleteBug(' + b.id + ')">Delete</button></li>';
  }).join('');
}

function deleteBug(id) {
  bugs = bugs.filter(function(b) { return b.id !== id; });
  renderBugs();
}

document.getElementById('alertBtn').onclick = function() {
  alert('Bug Registry v1.0\nTrack and manage software bugs.\nTotal bugs: ' + bugs.length);
};

document.getElementById('confirmBtn').onclick = function() {
  if (bugs.length === 0) {
    alert('No bugs to export!');
    return;
  }
  var confirmed = confirm('Export ' + bugs.length + ' bug(s) as JSON?');
  if (confirmed) {
    var json = JSON.stringify(bugs, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bugs.json';
    a.click();
    URL.revokeObjectURL(url);
  }
};

document.getElementById('promptBtn').onclick = function() {
  var term = prompt('Enter bug title to search:');
  if (term === null) return;
  term = term.toLowerCase();
  var results = bugs.filter(function(b) {
    return b.title.toLowerCase().indexOf(term) !== -1;
  });
  if (results.length > 0) {
    alert('Found ' + results.length + ' matching bug(s)');
  } else {
    alert('No bugs found matching "' + term + '"');
  }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopHub — Online Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#fff;color:#222}
.header{background:#131921;color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}
.header .logo{font-size:22px;font-weight:700;color:#febd69}
.header a{color:#fff;text-decoration:none;font-size:14px}
.header .search-bar{flex:1;display:flex}
.header .search-bar input{flex:1;padding:8px;border:none;font-size:14px;color:#333}
.header .search-bar button{padding:8px 16px;background:#febd69;border:none;cursor:pointer;font-size:14px}
.cart-badge{background:#f08804;color:#131921;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700}
.hero{background:linear-gradient(135deg,#232f3e,#37475a);color:#fff;padding:40px 24px;text-align:center}
.hero h1{font-size:32px;margin-bottom:8px}
.hero p{font-size:16px;opacity:0.9}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:24px;max-width:1200px;margin:0 auto}
.product{border:1px solid #ddd;border-radius:8px;padding:16px;text-align:center;transition:box-shadow 0.2s}
.product:hover{box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.product img{width:100%;height:150px;object-fit:cover;border-radius:4px;margin-bottom:8px}
.product h3{font-size:16px;margin-bottom:4px}
.product .price{font-size:20px;font-weight:700;color:#B12704;margin-bottom:8px}
.product .rating{color:#ffa41c;font-size:14px;margin-bottom:8px}
.btn{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:14px}
.btn-primary{background:#ffd814;color:#131921}
.btn-danger{background:#ffa41c;color:#131921}
.cart-view{display:none;max-width:800px;margin:24px auto;padding:0 24px}
.cart-item{display:flex;gap:16px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.cart-item img{width:60px;height:60px;object-fit:cover;border-radius:4px}
.checkout-view{display:none;max-width:600px;margin:24px auto;padding:0 24px}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:4px;font-weight:600;font-size:13px}
.form-group input{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px}
.checkout-summary{background:#f5f5f5;padding:16px;border-radius:8px;margin:16px 0}
.checkout-summary .total{font-size:20px;font-weight:700;margin-top:8px}
.empty{padding:60px 24px;text-align:center;color:#666}
</style>
</head>
<body>
<div class="header">
<span class="logo">🛒 ShopHub</span>
<div class="search-bar">
<input type="text" id="search-input" placeholder="Search products...">
<button onclick="searchProducts()">Search</button>
</div>
<a href="#" onclick="showCart();return false" id="cart-link">🛒 Cart <span class="cart-badge" id="cart-count">0</span></a>
<a href="#" onclick="showProducts();return false">Home</a>
</div>

<div class="hero" id="hero">
<h1>Welcome to ShopHub</h1>
<p>Your one-stop shop for everything</p>
</div>

<div class="products" id="products-view"></div>

<div class="cart-view" id="cart-view">
<h1 style="margin-bottom:16px">Shopping Cart</h1>
<div id="cart-items"></div>
<div id="cart-total" style="text-align:right;font-size:20px;font-weight:700;margin-top:16px"></div>
<button class="btn btn-primary" style="margin-top:16px;font-size:16px;padding:12px 24px" onclick="showCheckout()">Proceed to Checkout</button>
<button class="btn" style="margin-top:16px;margin-left:8px" onclick="showProducts()">Continue Shopping</button>
</div>

<div class="checkout-view" id="checkout-view">
<h1 style="margin-bottom:16px">Checkout</h1>
<div class="checkout-summary" id="checkout-summary"></div>
<h3 style="margin:16px 0">Shipping Information</h3>
<div class="form-group"><label>Full Name</label><input type="text" id="ship-name"></div>
<div class="form-group"><label>Address</label><input type="text" id="ship-address"></div>
<div class="form-group"><label>City</label><input type="text" id="ship-city"></div>
<div class="form-group"><label>ZIP Code</label><input type="text" id="ship-zip"></div>
<h3 style="margin:16px 0">Payment</h3>
<div class="form-group"><label>Card Number</label><input type="text" id="card-number" placeholder="1234-5678-9012-3456"></div>
<div class="form-group"><label>Expiry</label><input type="text" id="card-expiry" placeholder="MM/YY"></div>
<div class="form-group"><label>CVV</label><input type="text" id="card-cvv" placeholder="123"></div>
<button class="btn btn-primary" style="font-size:16px;padding:12px 24px;margin-top:8px" id="place-order-btn" onclick="placeOrder()">Place Order</button>
<div id="order-success" style="display:none;text-align:center;padding:40px">
<h2 style="color:green;margin-bottom:8px">✅ Order Placed Successfully!</h2>
<p>Order #<span id="order-id"></span></p>
<p style="margin-top:8px;color:#666">A confirmation email has been sent.</p>
<button class="btn btn-primary" style="margin-top:16px" onclick="showProducts()">Continue Shopping</button>
</div>
</div>

<div id="toast" style="position:fixed;bottom:24px;right:24px;background:#333;color:#fff;padding:12px 20px;border-radius:6px;display:none;z-index:200"></div>

<script>
const products = [
  {id:1, name:'Wireless Headphones', price:79.99, rating:'★★★★☆', img:'https://via.placeholder.com/220x150/eee/333?text=Headphones'},
  {id:2, name:'Smart Watch', price:199.99, rating:'★★★★★', img:'https://via.placeholder.com/220x150/eee/333?text=Watch'},
  {id:3, name:'Coffee Maker', price:49.99, rating:'★★★☆☆', img:'https://via.placeholder.com/220x150/eee/333?text=Coffee'},
  {id:4, name:'Running Shoes', price:89.99, rating:'★★★★☆', img:'https://via.placeholder.com/220x150/eee/333?text=Shoes'},
  {id:5, name:'Backpack', price:39.99, rating:'★★★★★', img:'https://via.placeholder.com/220x150/eee/333?text=Backpack'},
  {id:6, name:'Desk Lamp', price:29.99, rating:'★★★★☆', img:'https://via.placeholder.com/220x150/eee/333?text=Lamp'}
];

let cart = [];

function renderProducts(list){
  const container = document.getElementById('products-view');
  container.innerHTML = list.map(p => `
    <div class="product">
      <img src="${p.img}" alt="${p.name}">
      <h3>${p.name}</h3>
      <div class="price">$${p.price.toFixed(2)}</div>
      <div class="rating">${p.rating}</div>
      <button class="btn btn-primary" onclick="addToCart(${p.id})">Add to Cart</button>
    </div>
  `).join('');
}

function searchProducts(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  if(!q){ renderProducts(products); return; }
  const filtered = products.filter(p => p.name.toLowerCase().includes(q));
  renderProducts(filtered);
  if(filtered.length === 0){
    document.getElementById('products-view').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#666">No products found.</p>';
  }
}

function addToCart(id){
  const product = products.find(p => p.id === id);
  if(!product) return;
  const existing = cart.find(c => c.id === id);
  if(existing){ existing.qty++; }
  else { cart.push({...product, qty:1}); }
  updateCartCount();
  showToast(`${product.name} added to cart`);
}

function updateCartCount(){
  const count = cart.reduce((sum,c) => sum + c.qty, 0);
  document.getElementById('cart-count').textContent = count;
}

function showCart(){
  document.getElementById('products-view').style.display = 'none';
  document.getElementById('hero').style.display = 'none';
  document.getElementById('cart-view').style.display = 'block';
  document.getElementById('checkout-view').style.display = 'none';
  renderCart();
}

function showProducts(){
  document.getElementById('products-view').style.display = 'grid';
  document.getElementById('hero').style.display = 'block';
  document.getElementById('cart-view').style.display = 'none';
  document.getElementById('checkout-view').style.display = 'none';
  document.getElementById('order-success').style.display = 'none';
}

function showCheckout(){
  if(cart.length === 0){ showToast('Cart is empty'); return; }
  document.getElementById('cart-view').style.display = 'none';
  document.getElementById('checkout-view').style.display = 'block';
  const total = cart.reduce((sum,c) => sum + c.price * c.qty, 0);
  document.getElementById('checkout-summary').innerHTML = `
    <h3>Order Summary</h3>
    ${cart.map(c => `<p>${c.name} × ${c.qty} — $${(c.price*c.qty).toFixed(2)}</p>`).join('')}
    <div class="total">Total: $${total.toFixed(2)}</div>
  `;
}

function renderCart(){
  const container = document.getElementById('cart-items');
  if(cart.length === 0){
    container.innerHTML = '<p style="color:#666;padding:24px">Your cart is empty.</p>';
    document.getElementById('cart-total').textContent = '';
    return;
  }
  container.innerHTML = cart.map(c => `
    <div class="cart-item">
      <img src="${c.img}" alt="${c.name}">
      <div style="flex:1">
        <h4>${c.name}</h4>
        <p>$${c.price.toFixed(2)} × ${c.qty} = $${(c.price*c.qty).toFixed(2)}</p>
      </div>
      <button class="btn btn-danger" onclick="removeFromCart(${c.id})">Remove</button>
    </div>
  `).join('');
  const total = cart.reduce((sum,c) => sum + c.price * c.qty, 0);
  document.getElementById('cart-total').textContent = `Total: $${total.toFixed(2)}`;
}

function removeFromCart(id){
  cart = cart.filter(c => c.id !== id);
  updateCartCount();
  renderCart();
  showToast('Item removed');
}

function placeOrder(){
  const name = document.getElementById('ship-name').value.trim();
  const address = document.getElementById('ship-address').value.trim();
  const cardNum = document.getElementById('card-number').value.trim();
  if(!name || !address || !cardNum){
    showToast('Please fill all required fields');
    return;
  }
  // Simulate order
  const orderId = Math.floor(Math.random() * 1000000);
  cart = [];
  updateCartCount();
  // Show success
  document.querySelector('.checkout-view').children[0].style.display = 'none';
  document.querySelectorAll('#checkout-view > h1, #checkout-view > .checkout-summary, #checkout-view > h3, #checkout-view > .form-group').forEach(el => el.style.display = 'none');
  document.getElementById('place-order-btn').style.display = 'none';
  document.getElementById('order-success').style.display = 'block';
  document.getElementById('order-id').textContent = orderId;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

renderProducts(products);

// INTENTIONALLY BROKEN: "Sign In" / login link missing entirely — no auth
// INTENTIONALLY MISSING: No user account / registration
// INTENTIONALLY MISSING: No order history / order tracking
// INTENTIONALLY MISSING: No product reviews submission (display only)
// INTENTIONALLY MISSING: No wishlist
// INTENTIONALLY MISSING: No product categories/filtering (only text search)
// INTENTIONALLY BROKEN: Product images use placeholder.com — broken if offline
// INTENTIONALLY MISSING: No shipping calculator
// KNOWN WORKING: Product browsing, search, add to cart, cart management, checkout form, order placement
// KNOWN WORKING: Cart persistence within session (not across page reloads — no localStorage)
</script>
</body>
</html>
